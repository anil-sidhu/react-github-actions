name: "first workflow"
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
      
jobs:
    lint-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci
            
            - name: run ESLint in app
              run: npm run lint

    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci
            
            - name: run test cases
              run: npm run test
    build-job:
        needs: [lint-job,test-job]
        runs-on: ubuntu-latest

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci

            # Build React app in GitHub Actions
            - name: Build React app
              run: npm run build

            # - name: Check built HTML
            #   run: cat dist/index.html

            - name: Install Vercel CLI
              run: npm install --global vercel

            # Deploy the dist folder created above
            - name: Deploy build to Vercel
              run: vercel deploy dist --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"